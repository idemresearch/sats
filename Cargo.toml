[workspace]
resolver = "3"
members = [
    "crates/sats-core",
    "crates/sats",
    "crates/sats-alkanes",
    "crates/sats-web",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/jonatns/sats"
# 1.89 for std file locks (fs::File::lock), used by the grant lock.
rust-version = "1.89"

[workspace.dependencies]
sats-core = { path = "crates/sats-core" }
sats-alkanes = { path = "crates/sats-alkanes" }

bdk_wallet = { version = "=3.1.0", features = ["keys-bip39"] }
bdk_esplora = { version = "0.22.2", default-features = false, features = ["std", "blocking-https-rustls"] }
rusqlite = { version = "=0.31.0", features = ["bundled"] }

bip39 = "2.2.2"
argon2 = "0.5.3"
chacha20poly1305 = "0.10.1"
getrandom = "0.3"
subtle = { version = "2.6", default-features = false }
zeroize = { version = "1.9", features = ["zeroize_derive"] }
hex = "0.4.3"
base64 = "0.22"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

clap = { version = "4.6", features = ["derive", "env"] }
rmcp = { version = "=3.1.3", features = ["transport-io", "schemars"] }
tokio = { version = "1.53", features = ["rt", "macros"] }
owo-colors = "4.3"
rpassword = "7.5"
schemars = "1.0"
toml = "1.1"
directories = "6.0"
anyhow = "1.0"
humantime = "2.4"

minreq = { version = "2.14", features = ["https-rustls", "json-using-serde"] }

# Pinned so scripts/build-playground.sh can fetch the exact matching
# prebuilt wasm-bindgen CLI.
wasm-bindgen = "=0.2.127"

tempfile = "3"
assert_cmd = "2"
predicates = "3"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
