name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: sh -n setup.sh scripts/test-setup.sh
      - run: sudo sh scripts/test-setup.sh
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - name: Protected vault integration (root)
        run: |
          test_bin=$(cargo test -p sats-cli --test vault --no-run --locked --message-format=json | jq -r 'select(.reason == "compiler-artifact" and .target.name == "vault" and .executable != null) | .executable')
          test -n "$test_bin"
          sudo "$test_bin" --ignored
      - run: cargo build --release --locked
      - name: Release installation and refusal checks
        run: |
          ./target/release/sats --version
          if SATS_DIR="$RUNNER_TEMP/unused-wallet" ./target/release/sats balance > refusal.log 2>&1; then exit 1; fi
          grep -F 'install with' refusal.log
          # Hosted runners leave /usr/local/bin writable by non-root users,
          # which the installer rightly refuses. Restore a stock layout on
          # this throwaway machine so the default install path is tested.
          sudo chown root:root /usr/local /usr/local/bin
          sudo chmod 0755 /usr/local /usr/local/bin
          sudo sh setup.sh --binary target/release/sats
          /usr/local/bin/sats providers list
          if /usr/local/bin/sats --dir "$RUNNER_TEMP/unused-wallet" providers > refusal.log 2>&1; then exit 1; fi
          grep -F 'unexpected argument' refusal.log
          if sudo /usr/local/bin/sats balance > refusal.log 2>&1; then exit 1; fi
          grep -F 'run sats as yourself, not with sudo' refusal.log
      # Experimental Alkanes code is excluded from default builds; keep it
      # compiling and tested.
      - run: cargo clippy -p sats-cli --all-targets --features experimental-alkanes-execute -- -D warnings
      - run: cargo test -p sats-cli --locked --features experimental-alkanes-execute --bins --test alkanes

  macos-installer:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo sh scripts/test-setup.sh

  # Guards the portable-core boundary documented in docs/architecture.md.
  wasm-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p sats-core --target wasm32-unknown-unknown
      - run: cargo check -p sats-playground --target wasm32-unknown-unknown
