name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: sh -n setup.sh scripts/test-setup.sh
      - run: sh scripts/test-setup.sh
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked
      # Experimental Alkanes code is excluded from default builds; keep it
      # compiling and tested.
      - run: cargo clippy -p sats --all-targets --features experimental-alkanes-execute -- -D warnings
      - run: cargo test -p sats --locked --features experimental-alkanes-execute --bins --test alkanes
      # The protected vault needs root to create accounts and a setuid
      # binary: build as the runner, run the test binary with sudo.
      - name: Protected vault (setuid, as root)
        run: |
          cargo test -p sats --locked --test vault --no-run
          sudo "$(ls -t target/debug/deps/vault-* | grep -v '\.d$' | head -1)" --ignored

  # Guards the portable-core boundary documented in docs/architecture.md.
  wasm-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p sats-core --target wasm32-unknown-unknown
      - run: cargo check -p sats-web --target wasm32-unknown-unknown
