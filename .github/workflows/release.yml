name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Validate tag and package version
        if: github.event_name == 'push'
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tags must look like v0.1.0" >&2
            exit 1
          fi
          tag_version="${GITHUB_REF_NAME#v}"
          manifest_version=$(awk '
            /^\[workspace\.package\]$/ { in_package = 1; next }
            /^\[/ { in_package = 0 }
            in_package && /^version[[:space:]]*=/ {
              gsub(/.*=[[:space:]]*"|".*/, "")
              print
              exit
            }
          ' Cargo.toml)
          if [[ "$tag_version" != "$manifest_version" ]]; then
            echo "tag version $tag_version does not match Cargo.toml $manifest_version" >&2
            exit 1
          fi
      - run: sh -n setup.sh scripts/test-setup.sh
      - run: sh scripts/test-setup.sh
      - run: cargo test --workspace --locked

  build:
    needs: validate
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build -p sats --release --locked --target "${{ matrix.target }}"
      - name: Package release archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          asset="sats-${TARGET}.tar.gz"
          mkdir -p dist staging
          cp "target/${TARGET}/release/sats" staging/sats
          tar -czf "dist/${asset}" -C staging sats
          if command -v sha256sum >/dev/null 2>&1; then
            archive_sha=$(sha256sum "dist/${asset}" | awk '{ print $1 }')
          else
            archive_sha=$(shasum -a 256 "dist/${asset}" | awk '{ print $1 }')
          fi
          printf '%s  %s\n' "$archive_sha" "$asset" > "dist/${asset}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify release assets
        run: |
          cd dist
          for checksum in *.sha256; do
            sha256sum -c "$checksum"
          done
          cat ./*.sha256 | sort -k2 > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi
