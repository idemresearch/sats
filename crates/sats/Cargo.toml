[package]
name = "sats"
description = "A small, sharp Bitcoin wallet CLI — signing for humans and agents"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "sats"
path = "src/main.rs"

[features]
default = ["mcp"]
# The `sats mcp` agent server (rmcp + tokio). Disable for a smaller
# human-only binary: cargo install --no-default-features
mcp = ["dep:rmcp", "dep:tokio", "dep:schemars"]

[dependencies]
sats-core = { workspace = true }
sats-alkanes = { workspace = true }
bdk_wallet = { workspace = true, features = ["rusqlite"] }
bdk_esplora = { workspace = true }
rusqlite = { workspace = true }
clap = { workspace = true }
rmcp = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
owo-colors = { workspace = true }
rpassword = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
directories = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
minreq = { workspace = true }
humantime = { workspace = true }
hex = { workspace = true }
zeroize = { workspace = true }
# Random ids for keyless agent requests.
getrandom = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
assert_cmd = { workspace = true }
predicates = { workspace = true }
# test-utils lets integration tests seed the persisted wallet with
# deterministic confirmed UTXOs; it never ships in the binary.
bdk_wallet = { workspace = true, features = ["rusqlite", "test-utils"] }
