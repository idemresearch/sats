[package]
name = "sats-core"
description = "Portable Bitcoin wallet engine: plans, authorization, signing"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
bdk_wallet = { workspace = true }
bip39 = { workspace = true }
argon2 = { workspace = true }
chacha20poly1305 = { workspace = true }
getrandom = { workspace = true }
subtle = { workspace = true }
zeroize = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

# On wasm32 the OS RNG comes from the browser: getrandom 0.3 (ours) needs the
# `wasm_js` feature plus `--cfg getrandom_backend="wasm_js"` (see
# .cargo/config.toml), and the 0.2 line (via bdk/secp/argon2) needs `js`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }

[dev-dependencies]
bdk_wallet = { workspace = true, features = ["test-utils"] }
